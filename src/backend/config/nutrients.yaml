# Fixed micronutrient catalogue (spec 008). The ONLY definition of tracked
# nutrients, their units, daily values and safety upper limits (FR-015,
# FR-018) — nothing else in the codebase or the clients may duplicate it.
#
# Rules (enforced by backend.config.NutrientCatalog):
#   key          stable snake_case id, never renamed or reused (FR-016); no unit
#   unit         g | mg | mcg (USDA "ug" is mcg)
#   group        carbs | fat | other | vitamins | minerals (display group)
#   direction    limit (stay under) | target (reach) | none
#   daily_value  FDA label Daily Value in `unit`; null = amount only (FR-001a)
#   usda_names   USDA FoodData Central names mapped onto this key, in priority
#                order (FR-006); empty = USDA never reports it
#   usda_only    true = never AI-estimated; unknown unless USDA has it (FR-004a)
#   max_per_100g plausibility cap for estimates (FR-007); filled by
#                scripts/compute_micro_caps.py
#   column       value lives in that meal_log column, not in meal_log.micros
#   derived      computed on read from another key (never stored)
#   upper_limit  Tolerable Upper Intake Level for Mindful safety alerts
#   status       active | retired
version: 1

groups:
  - {id: carbs, name: "Carbohydrate detail", order: 1}
  - {id: fat, name: "Fat detail", order: 2}
  - {id: other, name: "Other", order: 3}
  - {id: vitamins, name: "Vitamins", order: 4}
  - {id: minerals, name: "Minerals", order: 5}

