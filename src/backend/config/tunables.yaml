# ============================================================================
# Mealsy tunables — every prompt, model name, token limit, and threshold
# that you may want to tune lives here. Code reads this file once at import
# via backend.config.get_tunables(); restart uvicorn / celery after editing.
#
# Override the file location with the NUTRICHAT_TUNABLES_PATH env var
# (useful for A/B-testing an alternative prompt set without touching git).
# ============================================================================

models:
  # Entity extraction, image classification, corrections, intent routing,
  # query parsing, fact extraction. Cheapest/fastest tier — every user
  # message touches this model at least once.
  # Used in: agent/llm.py (FLASH_LITE_MODEL), agent/tools/meals.py,
  #          agent/orchestrator.py, agent/coaching.py, workers/tasks.py
  extraction: "gemini-3.1-flash-lite"

  # Conversational coaching responses (grounded answers to nutrition
  # questions). Same model as extraction since 2026-10-13: the Google
  # project behind GOOGLE_API_KEY was replaced, and gemini-2.5-flash is not
  # offered to new projects. A larger model here is the first thing to try
  # if coaching answer quality drops.
  # Used in: agent/coaching.py generate_response()
  coaching: "gemini-3.1-flash-lite"

  # Embedding model for meal summaries, preference facts, and query-time
  # ANN search. MUST stay consistent with embedding_dim below and with the
  # vector(768) columns in meal_log / user_memory — changing the model
  # without re-embedding all stored vectors breaks similarity search.
  # Used in: agent/llm.py embed_text(), agent/context.py _embed_query()
  embedding: "models/gemini-embedding-001"

  # Output dimensionality requested from the embedding model. Must equal
  # the pgvector column dimension (vector(768)). Do not change without a
  # migration + full re-embed.
  embedding_dim: 768

token_limits:
  # Max output tokens for the log_meal/coaching intent classifier in
  # agent/orchestrator.py. Gemini 3.1 flash-lite spends "thinking" tokens
  # from this same budget before emitting the structured JSON — values
  # below ~100 cause truncated/empty output and OutputParserException.
  # 200 is safe; raise if you see intent-classification parse errors.
  intent_classifier_max_output: 200

  # Reasoning ("thinking") token budget for the extraction-tier Gemini calls:
  # entity extraction, correction, image classification, decomposition, intent
  # classification, log-reply, nutrition estimate, and query parsing. All are
  # simple structured-output tasks, and with thinking left on the model
  # spends ~1-3s of latency per call reasoning before
  # emitting the JSON. 0 disables thinking entirely (applied in agent/llm.py
  # make_llm for LangChain calls and via GoogleModelSettings for the pydantic-ai
  # estimate/parse agents). Raise only if you see a structured-output quality
  # regression on complex meals. The coaching *prose* agent is intentionally
  # exempt — it keeps thinking on for answer quality.
  extraction_thinking_budget: 0

usda:
  # ── How food matching works (read before tuning) ────────────────────────
  # For each food the user names, usda_lookup_batch:
  #   1. Searches FoodData Central and takes FDC's top relevance-ranked hit
  #      (which entry wins is governed by FDC ranking + `data_types`, NOT by
  #      our score — see data_types/page_size below).
  #   2. Scores that hit with _confidence = query-word COVERAGE: the fraction
  #      of the user's food words found in the FDC description, after
  #      singularizing and dropping filler words. Coverage (not Jaccard) is
  #      used deliberately: FDC descriptions are verbose ("Rice, white,
  #      long-grain, raw, enriched") and a union-based metric wrongly tanked
  #      correct matches, sending almost everything to the LLM estimator.
  #      So "white rice" and "banana" score 1.0; "chicken biryani" vs
  #      "Chicken spread" scores 0.5 (only "chicken" matched).
  #   3. If that score is below `match_confidence_floor` (or there is no hit
  #      at all), it DISCARDS the weak USDA hit and LLM-estimates instead.
  # Net effect: USDA is strongly preferred; the estimator is the exception,
  # reserved for genuine misses. `match_confidence_floor` is the main dial.
  # ─────────────────────────────────────────────────────────────────────────

  # FoodData Central search endpoint.
  # Used in: agent/tools/usda.py
  search_url: "https://api.nal.usda.gov/fdc/v1/foods/search"

  # Which FDC data types to search. Foundation + SR Legacy are whole-food
  # entries with full nutrient panels; add "Branded" to match packaged
  # products (noisier descriptions, lower match confidence).
  # NOTE: this also steers WHICH entry wins. We take FDC's #1 relevance hit,
  # so a loose query can land on a sub-ideal entry (e.g. "white rice" ->
  # "Flour, rice, white", "greek yogurt" -> a flavored branded yogurt). That
  # is an FDC-ranking effect, separate from the match/estimate gate; narrow
  # or widen `data_types` to influence it.
  data_types: "Foundation,SR Legacy"

  # Number of candidate foods requested per search. The top hit becomes
  # the match; the first 3 become the "candidates" alternatives shown on
  # the confirmation card. (We do not re-rank these by coverage — the top
  # hit is FDC's relevance #1; raising this only widens the alternatives.)
  page_size: 5

  # Per-request timeout (seconds) for the FDC API. FDC search normally answers
  # well under 1s, so a tight timeout keeps a slow/hung request from stalling
  # the whole confirmation card (which can't render until the slowest entity
  # resolves). Lowered from 8s: at 8s a single flaky item gated the card for
  # ~20s (8 + backoff + 8 + LLM-estimate); 4s bounds that to ~4s + estimate.
  request_timeout_s: 4

  # Total attempts per lookup (1 initial + retries). usda_lookup_batch runs on
  # the interactive card-render path, so retries are disabled (1 attempt): a
  # transient FDC miss falls straight to the LLM estimate rather than making
  # the user wait out a backoff + second request. Raise to 2 to trade latency
  # for resilience if FDC blips start pushing real foods to estimates.
  max_attempts: 1

  # Seconds to sleep between retry attempts (only used when max_attempts > 1).
  retry_backoff_s: 0.5

  # Confidence assigned to Postgres cache hits (skips coverage scoring —
  # a cached row was already accepted once).
  cache_hit_confidence: 0.95

  # Below this match confidence the confirmation card shows a warning
  # flag (⚠) next to the item.
  low_confidence_flag_below: 0.6

  # Below this match confidence the card offers the next-best candidate
  # ("say 'use X' to switch").
  suggest_alternative_below: 0.85

  # Confidence gate (Plan A — LLM nutrition estimation fallback). When the
  # best FDC match's match_confidence is below this floor (or there is no
  # usable match at all, fdc_id=-1), usda_lookup_batch discards the weak hit
  # and calls estimate_nutrition_llm() instead.
  #
  # match_confidence is query-word COVERAGE: the fraction of the user's food
  # words found in the FDC description (see _confidence). Tuning guide:
  #   0.5  — accept any half-matched food; lets "chicken biryani" log as
  #          "Chicken spread" (1 of 2 words). Too loose.
  #   0.6  — DEFAULT. Rejects half-matches (biryani -> estimate) but accepts
  #          a real food missing one filler descriptor (e.g. "spicy chicken
  #          curry" -> "Chicken curry", 2/3). Strongly prefers USDA.
  #   0.75 — stricter: requires nearly all query words present; estimates
  #          more often. Raise this if USDA is matching too loosely.
  #   1.0  — only exact full-coverage matches use USDA; everything else
  #          is LLM-estimated.
  match_confidence_floor: 0.6

  # match_confidence assigned to LLM nutrition estimates (USDAResult.
  # estimated=True, source="LLM_ESTIMATE"). Kept low/neutral rather than
  # faking a high score — the `estimated` flag is the real signal to the
  # UI, this value just keeps the ⚠ heuristics sane.
  llm_estimate_confidence: 0.3

  # --- Local FoodData Central database -------------------------------------
  # When true, lookups are served from the SQLite copy bundled in the image
  # (src/backend/data/usda_fdc.sqlite3, 13,694 Foundation + SR Legacy + FNDDS
  # foods) instead of the FDC search API. Set false to fall back to the live
  # API + Postgres cache path, which is kept intact for exactly that purpose.
  #
  # Why local is the default: the FDC API returns spurious HTML 404s at random
  # (measured 2026-08-24: 1 in 5 sequential calls, 3 of 8 concurrent, with
  # x-ratelimit-remaining at 3510/3600 — so not quota). With max_attempts: 1
  # every such blip silently degrades a real food to an LLM estimate.
  # Override the file location with the USDA_DB_PATH env var.
  use_local_db: true

  # FTS5/bm25 rows retrieved before re-ranking by coverage. Measured on the
  # eval cases: identical accuracy from 10 to 400, so this is set for headroom
  # on longer queries, not for score. 25 costs ~4 ms/lookup.
  candidate_pool_size: 25

  # Alternative descriptions surfaced on the card ("say 'use X' to switch").
  max_candidates: 3

retrieval:
  # Guideline passage retrieval for the coaching agent
  # (backend/guidelines/retrieval.py). Scores are cosine similarity
  # (1 - cosine distance) between the query embedding and a chunk embedding.

  # Passages scoring below this are dropped rather than shown to the model.
  # Without a floor, a question the corpus does not cover still pulls in the
  # k nearest chunks and invites an irrelevant citation. Measured on the two
  # curated sources: "how much added sugar is ok for me?" scores 0.61-0.74,
  # "what car should I buy?" scores 0.46-0.50, so 0.58 sits in the gap.
  # Lower it if the coach stops citing when it should; raise it if it cites
  # tangential passages.
  guideline_min_score: 0.58

  # Passages fetched per coaching turn before the floor is applied. Each one
  # costs ~150 prompt tokens.
  guideline_top_k: 5

memory:
  # Cosine-distance threshold for preference-fact dedup in
  # workers/tasks.py extract_and_store_facts. A new fact whose nearest
  # existing user_memory row is closer than this is dropped as a
  # duplicate. Lower = stricter (more near-duplicates stored). PRD §10.2.
  dedup_distance_threshold: 0.05

  # Confidence assigned to newly extracted preference facts.
  new_fact_confidence: 0.8

  # Number of preference facts retrieved by pgvector ANN for the coaching
  # system prompt. PRD §5.2 budgets ~150 tokens for this block.
  # Used in: agent/context.py
  top_k_preferences: 3

  # --- Curated preference profile (agent/memory.py) -----------------------
  # When on, the coach gets the user's WHOLE profile on every turn instead
  # of the top-k facts above, and no embedding call is made for it. Off =
  # legacy top-k path. Users in profile_allowlist get the profile even when
  # profile_enabled is false (dark launch on named accounts).
  profile_enabled: false
  profile_allowlist: []

  # Hard cap on live facts per user and on their total characters. The cap
  # is what keeps the prompt block bounded (1500 chars is about 350
  # tokens), so raise it only with the prompt budget in mind. On overflow
  # the oldest inferred like/habit/context fact is evicted; restrictions
  # and facts the user stated are never evicted.
  profile_max_facts: 40
  profile_max_chars: 1500

  # Tombstones (facts the user removed) kept per user so they are not
  # learned again. Oldest beyond this are purged.
  profile_max_tombstones: 50

  # Save decision (agent/memory_judge.py). The curator model drafts
  # candidate changes; GLiDE scores each one and only those at or above
  # save_min_probability are written. The score is stored as the fact's
  # confidence. Probe 2026-10-13 on eval/cases/memory_judge.jsonl (32
  # hand-written message/candidate pairs): every candidate to keep scored
  # >= 0.84 and every one to drop <= 0.09, so 0.6 sits in a wide gap. The
  # cases are synthetic; re-check on real turns, and favour recall: a
  # missed allergy is silent, while a wrong fact is visible to the user
  # and one tap to remove.
  save_min_probability: 0.6

  # What happens to a candidate GLiDE could not score (no FASTINO_API_KEY,
  # timeout, error). true = save it on the curator's word, as before the
  # judge existed; false = drop it.
  save_unjudged: true

  # Per-request wait for a memory judgment. Background work, so far more
  # patient than glide.request_timeout_s on the reply path.
  judge_timeout_s: 5.0

  # "Often eats" block: foods logged at least staples_min_count times in
  # the last staples_window_days, per meal type. Derived from meal_log on
  # read and cached in Redis for staples_cache_ttl_s.
  # Used in: agent/tools/history.py get_staple_foods
  staples_window_days: 30
  staples_min_count: 3
  staples_cache_ttl_s: 21600

  # Weekly log-habits job (workers/tasks.py): runs only for users with at
  # least this many meals in the staples window, and writes at most this
  # many interpreted habit facts per user.
  weekly_habits_min_meals: 15
  weekly_habits_max_facts: 3

  # Short-term conversation memory for the coaching agent: the last N
  # user/assistant exchanges (across BOTH logging and coaching turns —
  # logging turns are stored as one-line summaries) kept in Redis at
  # `coach_history:{user_id}`. Lets follow-ups like "and yesterday?" or
  # "what should I eat now?" resolve against what was just said/logged.
  # Each exchange costs ~2 messages of prompt per coaching call.
  # Used in: db/redis_client.py append_coaching_turns / get_coaching_history
  coaching_history_turns: 6

  # TTL (seconds) on the coaching history key, refreshed on every turn.
  # A day: a follow-up the next morning shouldn't inherit last night's
  # thread, and stale context is worse than none.
  coaching_history_ttl_s: 43200

junk:
  # Per-100g nutrient-density heuristic used by log_meal to flag junk
  # food in meal_log.flags ({"has_junk": bool, "junk_items": [...]}).
  # An item is junk when (sugar_per_100g >= sugar_density_g AND
  # fiber_per_100g < fiber_floor_g) OR sat_fat_per_100g >= sat_fat_density_g.
  # Whole fruit escapes via the fiber floor; soda/candy/pastry/fried
  # foods get caught. Tune against real logs.
  sugar_density_g: 9.0
  sat_fat_density_g: 7.0
  fiber_floor_g: 2.0

summaries:
  # A day with total fiber >= this many grams counts as a "veg day" in
  # daily_summary (proxy — entities carry no food-category field).
  # Used in: workers/tasks.py aggregate_daily_summary
  veg_day_fiber_threshold_g: 5.0

  # A weekly average below this fraction of the user's goal marks the
  # nutrient as a weak spot in weekly_summary.
  weak_spot_ratio: 0.6

  # A meal type (or protein goal) logged/hit on fewer than this many days
  # per week is reported as missed/weak in weekly_summary.
  missed_meal_min_days: 4

day:
  # The rolling "nutrition day" for daily totals. Today's progress resets at
  # reset_hour, local time in `timezone`; meals logged between midnight and
  # reset_hour count toward the previous day. Derived from meal_log rows, so
  # the rollover happens automatically — no cron has to fire for it.
  # Used in: db/redis_client.py current_day_bounds / get_today_totals
  timezone: Europe/Oslo
  reset_hour: 1

nutrient_checkup:
  # Daily Nutrient Check-up (issue #9): rolling 7-day daily averages + trend
  # vs the prior 7 days, written nightly by build_nutrient_checkup. Protein
  # and Fiber come from meal_log's top-level columns (get_macros_for_range);
  # Sugar and the vitamins/minerals below come from meal_log.entities[]
  # .nutrients (exact USDA names, via get_micronutrients_for_range). Note:
  # LLM-estimated items contribute macros but no vitamins, so vitamin
  # averages may undercount for users with many estimated foods.
  # Used in: agent/tools/history.py get_nutrient_checkup_aggregates
  micronutrients:
    Sugar:
      usda_name: "Total Sugars"
      unit: g
    "Vitamin C":
      usda_name: "Vitamin C, total ascorbic acid"
      unit: mg
    "Vitamin D":
      usda_name: "Vitamin D (D2 + D3)"
      unit: mcg
    Iron:
      usda_name: "Iron, Fe"
      unit: mg
    Calcium:
      usda_name: "Calcium, Ca"
      unit: mg
    "Vitamin B-12":
      usda_name: "Vitamin B-12"
      unit: mcg

  # A trend within +/- this fraction of the prior week's average is reported
  # as "flat" (->) rather than up/down, so small week-to-week noise doesn't
  # flip the arrow.
  flat_threshold_pct: 0.05

  # Generic adult daily values (FDA 2016 Daily Values where available).
  # Sugar has no official DV; we use 50g as a WHO "free sugars" proxy —
  # documented here because it's a judgment call, not a regulatory figure.
  rda:
    Protein: 50          # g
    Fiber: 28            # g
    Sugar: 50            # g (proxy, see comment above)
    "Vitamin C": 90       # mg
    "Vitamin D": 20       # mcg
    Iron: 18              # mg
    Calcium: 1300         # mg
    "Vitamin B-12": 2.4   # mcg

features:
  # Off on feat/android-app (#57): a composite dish arrives as ONE item with the
  # extractor's gram estimate; the user opts in via "Break into ingredients".
  auto_decompose_enabled: false

glide:
  # Fastino GLiDE (System One): one request per fresh text message answers
  # "log a meal or ask the coach?" plus two yes/no questions (does it also
  # report food; does it need guidance). See agent/system_one.py and
  # specs/009-migrate-jev-to-glide/. Needs FASTINO_API_KEY; without it every
  # fresh message is routed by the Gemini classifier instead. Also answers
  # the memory save decision (agent/memory_judge.py).
  base_url: "https://api.fastino.ai"
  model: "fastino/GLiDE"

  # Certainty behind the chosen handler (0.5-1.0) at or above which the
  # judgment's route is acted on directly. Below it, the Gemini classifier
  # gives a second opinion. Both misroutes are recoverable (a card the user
  # cancels, a text reply), so a moderate bar. Probe 2026-10-13 on the 94
  # routing cases, GLiDE alone: 94/94 routed correctly, 92 scored >= 0.94
  # and 2 fell below 0.75 (lowest 0.67). Tune on eval/probe_glide.py
  # --scores and the eval gate, not by feel.
  intent_min_probability: 0.75

  # P(message also reports food) at or above which a coaching reply ends with
  # log_offer_text ("I had pizza, was that bad?"). Probe 2026-10-13: mixed
  # messages 0.99-1.00, pure questions and small talk <= 0.02.
  log_offer_min_probability: 0.7
  log_offer_text: "Want me to log that? Send me what you had and I'll add it."

  # Per-request wait for a routing judgment, no retries. Past it, Gemini
  # decides. Routing is in front of every fresh message, so fail fast.
  # Measured 2026-10-13 from the dev machine: p50 360 ms, p95 615 ms at
  # concurrency 1 and p50 389 ms, p95 610 ms at 10; none of 150 requests
  # passed 0.8 s. Re-check from the Railway container (eval/probe_glide.py).
  request_timeout_s: 0.8

  # Wait for the startup warm-up request, which may hit a model that is
  # still loading.
  warm_up_timeout_s: 30.0

routing:
  # log_meal/coaching routing moved to a GLiDE judgment (see `glide:` above);
  # its keyword lists were deleted. What remains is the card-reply classifier.
  #
  # Keyword sets for the confirmation-card reply classifier in
  # agent/tools/meals.py classify_intent (no LLM). Word-level match after
  # punctuation stripping; multi-word entries match as substrings.
  # Anything matching neither set is treated as a correction.
  confirm_keywords:
    - "yes"
    - "yep"
    - "yeah"
    - "correct"
    - "right"
    - "ok"
    - "okay"
    - "log"
    - "confirm"
    - "looks good"
    - "sure"
    - "good"
    - "perfect"
  reject_keywords:
    - "no"
    - "nope"
    - "cancel"
    - "nevermind"
    - "never mind"
    - "stop"
    - "quit"

  # Lead-ins that mark a *fresh* meal statement typed while a confirmation card
  # is still pending (e.g. "i had mutton curry"). classify_intent returns
  # "new_meal" when the lowered/stripped message starts with one of these AND
  # carries no additive qualifier from new_meal_exclusions below — so the new
  # meal supersedes the pending card instead of merging into it. Prefix match
  # on the whole message.
  new_meal_leadins:
    - "i had"
    - "i ate"
    - "i just had"
    - "i just ate"
    - "just had"
    - "just ate"
  # Additive qualifiers that keep a lead-in message a *correction* (merge into
  # the pending card) rather than a new meal — "i had some rice too" extends the
  # card, it does not replace it. Word-level match, except "as well" which is
  # multi-word and matched as a substring.
  new_meal_exclusions:
    - "also"
    - "too"
    - "as well"
    - "plus"

# Prompts live as individual Markdown files in the prompts/ directory
# beside this file (one <key>.md per prompt), loaded by get_tunables().
# Edit a prompt by editing its .md file; add one by adding a field to
# PromptsConfig in __init__.py and a matching <field>.md file.

# Tolerable Upper Intake Levels for Mindful Eating safety alerts. An alert
# fires when a day's intake of the nutrient reaches or exceeds `ul`. Values are
# conservative adult defaults; `usda_name` is the key used to sum the nutrient
# from meal_log.entities. Single threshold, no age/sex stratification in V1.
upper_limits:
  Sodium:
    usda_name: "Sodium, Na"
    unit: mg
    ul: 2300
    source: "WHO — Sodium intake for adults (2012)"
    url: "https://www.who.int/publications/i/item/9789241504836"
  "Total Sugars":
    usda_name: "Total Sugars"
    unit: g
    ul: 50
    source: "WHO — Sugars intake for adults and children (2015)"
    url: "https://www.who.int/publications/i/item/9789241549028"
  "Saturated Fat":
    usda_name: "Fatty acids, total saturated"
    unit: g
    ul: 22
    source: "FDA Dietary Guidelines for Americans 2020-2025"
    url: "https://www.dietaryguidelines.gov"
  "Vitamin A":
    usda_name: "Vitamin A, RAE"
    unit: mcg
    ul: 3000
    source: "NASEM DRI — Vitamin A (2001)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK222318/"
  "Vitamin D":
    usda_name: "Vitamin D (D2 + D3)"
    unit: mcg
    ul: 100
    source: "NASEM DRI — Vitamin D (2011)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK56070/"
  Iron:
    usda_name: "Iron, Fe"
    unit: mg
    ul: 45
    source: "NASEM DRI — Iron (2001)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK222309/"
  Zinc:
    usda_name: "Zinc, Zn"
    unit: mg
    ul: 40
    source: "NASEM DRI — Zinc (2001)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK222317/"
  Niacin:
    usda_name: "Niacin"
    unit: mg
    ul: 35
    source: "NASEM DRI — Niacin (1998)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK114304/"
  Calcium:
    usda_name: "Calcium, Ca"
    unit: mg
    ul: 2500
    source: "NASEM DRI — Calcium (2011)"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK56070/"
