[project]
name = "nutrichat"
version = "0.1.0"
description = "Natural language nutrition tracking agent backed by USDA FoodData Central"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Agent / LLM
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "anthropic>=0.36.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0", # Alembic sync driver
    "psycopg[binary]>=3.0.0", # LangGraph checkpointer async driver (binary bundles libpq for Railway)
    "psycopg-pool>=3.2.0", # Self-healing connection pool for the checkpointer
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "langgraph-checkpoint-postgres>=2.0.0", # Persistent chat history
    # Cache / queue
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    # HTTP
    "aiohttp>=3.10.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    # Config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "logfire[asyncpg,celery,fastapi,httpx,redis]>=4.36.0",
    "pydantic-ai-slim[google]>=1.107.0",
    "opentelemetry-instrumentation-langchain>=0.61.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.63b1",
    "aiogram>=3.28.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
docs = [
    "sphinx>=8.1.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
    "sphinx-autodoc-typehints>=2.5.0",
    "sphinxcontrib-mermaid>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres + Redis (deselect with '-m \"not integration\"')",
]

[tool.logfire]
# Tests and CI run without LOGFIRE_TOKEN; observability is a no-op there.
# Suppress the "not configured" warning emitted by cost/span helpers.
ignore_no_config = true
